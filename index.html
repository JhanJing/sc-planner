let D;

  try{ D=JSON.parse(localStorage.getItem(KEY)); }catch(e){ D=null; }
  if(!D||!D.settings) D=defaultData();

}
function upgradeData(){
  const v=D.tplVer||1;
  if(v<2){
    D.settings.sport=D.settings.sport||'羽球';
    const keep=D.tests.filter(t=>!DEFAULT_TESTS.some(n=>n.k===t.k)&&!['s10','s20','a505','pushup','sitreach'].includes(t.k));
    D.tests=DEFAULT_TESTS.concat(keep);
  }
  if(v<4) D.phases.forEach(p=>{ const n=DEFAULT_PHASES.find(x=>x.name===p.name); if(n) p.goal=n.goal; });
  if(!D.tests.some(t=>t.k==='sitH')){
    const i=D.tests.findIndex(t=>t.k==='height');
    D.tests.splice(i+1,0,{k:'sitH',n:'坐高',u:'cm',lb:false});
  }
  if(v<4) Object.values(D.sessions).forEach(s=>{
    const used=s.status==='done'||s.actual||s.notes||Object.keys(s.attendance||{}).length;
    if(!used){ delete s.plan; delete s.focus; }
  });
  if(v<5) Object.values(D.sessions).forEach(s=>{
    const extra=[s.actual&&('實際執行：'+s.actual), s.comm&&('溝通：'+s.comm)].filter(Boolean);
    if(extra.length){ s.notes=[s.notes].concat(extra).filter(Boolean).join('\n'); }
    delete s.actual; delete s.comm;
  });
  if(v<6) Object.values(D.sessions).forEach(s=>{
    if(s.rpe!=null) return;
    const r=Object.values(s.attendance||{}).filter(x=>x.rpe!==''&&x.rpe!=null).map(x=>+x.rpe);
    if(r.length) s.rpe=Math.round(r.reduce((a,b)=>a+b,0)/r.length*10)/10;
  });
  if(v<7) D.phases.forEach(p=>{ p.goal=(p.goal||'').replace('前測；','').replace('；1/19 期中測驗','').replace('；3/30 後測','').replace('3/30 後測。','').replace('；低強度跳躍；','；低強度跳躍。'); });
  D.tplVer=7;
  try{ localStorage.setItem(KEY,JSON.stringify(D)); }catch(e){}
}

}

// ── 雲端同步（私人 GitHub 資料庫）──────────────────────
const SYNC_KEY='zsjh_sync';
let SY={token:'',repo:'JhanJing/sc-planner-data',sha:'',dirty:false}, syVer=0, _syTimer=null, syBusy=false, syAgain=false;
try{ Object.assign(SY,JSON.parse(localStorage.getItem(SYNC_KEY)||'{}')); }catch(e){}
function syMeta(){ try{ localStorage.setItem(SYNC_KEY,JSON.stringify(SY)); }catch(e){} }
function hhmm(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
let syLast='';
function syShow(m){ syLast=m; const st=document.getElementById('syncSt'); if(st) st.classList.toggle('link',!!SY.token); ['syncSt','syncState'].forEach(id=>{ const e=document.getElementById(id); if(e) e.textContent=(id==='syncSt'&&m?'同步：':'')+m; }); }
const b64e=t=>btoa(unescape(encodeURIComponent(t)));
const b64d=t=>decodeURIComponent(escape(atob(t.replace(/\s/g,''))));
function ghData(method,body){
  return fetch('https://api.github.com/repos/'+SY.repo+'/contents/data.json',{method,cache:'no-store',
    headers:{'Authorization':'Bearer '+SY.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
    body:body?JSON.stringify(body):undefined});
}
async function syPush(sha){
  const v0=syVer;
  const body={message:'sync '+new Date().toISOString(),content:b64e(JSON.stringify(D))};
  if(sha) body.sha=sha;
  const r=await ghData('PUT',body);
  if(r.status===409||r.status===422) throw new Error('版本衝突，請再按一次「立即同步」');
  if(!r.ok) throw new Error('上傳失敗（'+r.status+'）');
  const j=await r.json();
  SY.sha=j.content.sha; if(syVer===v0) SY.dirty=false; syMeta();
  syShow(SY.dirty?'待上傳…':'已同步 '+hhmm());
}
function adoptRemote(remote,sha){
  stashPrev(); D=remote; if((D.tplVer||1)<7) upgradeData();
  try{ localStorage.setItem(KEY,JSON.stringify(D)); }catch(e){}
  SY.sha=sha; SY.dirty=false; syMeta(); curDate=null; render(); syShow('已同步 '+hhmm());
}
async function syncNow(){
  if(!SY.token){ syShow(''); return; }
  if(syBusy){ syAgain=true; return; }
  syBusy=true; let again=false;
  try{
    syShow('同步中…');
    const r=await ghData('GET');
    if(r.status===404){ await syPush(null); }
    else if(r.status===401||r.status===403) throw new Error('金鑰無效或沒有權限');
    else if(!r.ok) throw new Error('GitHub 回應 '+r.status);
    else{
      const j=await r.json();
      if(j.sha===SY.sha){ if(SY.dirty) await syPush(j.sha); else syShow('已同步 '+hhmm()); }
      else{
        const remote=JSON.parse(b64d(j.content));
        if(!validData(remote)) throw new Error('雲端的 data.json 格式不對');
        const firstWithData=(SY.sha===''&&hasContent(D));
        if(!SY.dirty&&!firstWithData) adoptRemote(remote,j.sha);
        else if(confirm('雲端和這台裝置的資料不一樣。\n\n「確定」＝改用雲端的資料（這台的資料會被取代，之後可在設定還原）\n「取消」＝用這台的資料覆蓋雲端')) adoptRemote(remote,j.sha);
        else await syPush(j.sha);
      }
    }
    again=SY.dirty;
  }catch(e){ syShow(!navigator.onLine||e instanceof TypeError?'連不上網路，連線後自動上傳':'失敗：'+e.message); }
  finally{ syBusy=false; if(again||syAgain){ syAgain=false; setTimeout(syncNow,800); } }
}
window.addEventListener('online',()=>syncNow());
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'||SY.dirty) syncNow(); });
function toast(m,act,ms){
  const t=$('toast'); t.textContent=m;
  if(act){ const b=document.createElement('button'); b.className='tact'; b.textContent=act.label; b.onclick=()=>{ act.fn(); t.classList.remove('show','act'); }; t.appendChild(b); t.classList.add('act'); }
  else t.classList.remove('act');
  t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show','act'),ms||(act?6000:1800));
}

function ymd(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayStr(){ return ymd(new Date()); }
function md(s){ const d=parse(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function allDates(){
  const out=[]; let d=parse(D.settings.start); const e=parse(D.settings.end);
  while(d.getDay()!==2) d.setDate(d.getDate()+1);
  while(d<=e){ out.push(ymd(d)); d.setDate(d.getDate()+7); }
  return out;
}
function phaseOf(date){ return D.phases.find(p=>date>=p.start&&date<=p.end)||null; }
function sess(date){
  if(!D.sessions[date]) D.sessions[date]={};
  const s=D.sessions[date];
  if(!s.status) s.status='planned';
  if(!s.plan){
    const ph=phaseOf(date); const g=ph?PHASE_GUIDE[ph.name]:null;
    s.plan={}; BLOCKS.forEach(b=>s.plan[b.k]=[]);
    if(!s.focus) s.focus=g?g.focus:'';
  }
  BLOCKS.forEach(b=>{ const v=s.plan[b.k]; if(!Array.isArray(v)) s.plan[b.k]=String(v||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>({name:x,sets:'',reps:'',note:''})); });
  if(!s.attendance) s.attendance={};
  return s;
}
function peek(date){ return D.sessions[date]||{status:'planned'}; }

      if(e.key!=='Enter') return; e.preventDefault();
      const nx=i.nextElementSibling;
      if(nx&&nx.tagName==='INPUT'){ nx.focus(); return; }
      const [k,n]=i.dataset.p.split('.');
      const nr=T.querySelector(`[data-p="${k}.${+n+1}.name"]`);
      if(nr) nr.focus(); else T.querySelector(`[data-xadd="${k}"]`).click();
    };
  });
  T.querySelectorAll('[data-xadd]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.xadd; s.plan[k].push({name:'',sets:'',reps:'',note:''}); save(); renderSession();
    const l=[...$('tab-session').querySelectorAll('[data-p^="'+k+'."][data-p$=".name"]')].pop(); if(l) l.focus();
  });
  T.querySelectorAll('[data-xdel]').forEach(b=>b.onclick=()=>{
    const [k,n]=b.dataset.xdel.split('.'); const row=s.plan[k].splice(+n,1)[0]; save(); renderSession();
    if(row&&(row.name||row.sets||row.reps||row.note)) toast('已刪除',{label:'復原',fn:()=>{ s.plan[k].splice(+n,0,row); save(); renderSession(); }});
  });
  if($('copyFrom')) $('copyFrom').onchange=e=>{
    const f=e.target.value; if(!f) return;
    if(countRows(s)>0&&!confirm('用 '+md(f)+' 的計畫覆蓋本堂已寫的內容？')){ e.target.value=''; return; }
    s.plan=JSON.parse(JSON.stringify(sess(f).plan)); save(); renderSession(); toast('已複製 '+md(f)+' 的計畫');
  };
  const sumUp=()=>{ $('attSum').textContent=(s.rpe===''||s.rpe==null)?'':'sRPE（RPE × 分鐘）＝ '+Math.round(s.rpe*(s.minutes??90)); };
  $('sRpe').oninput=e=>{
    s.rpe=e.target.value===''?'':+e.target.value;
    if(s.rpe!==''&&s.status==='planned'){ s.status='done'; $('sStatus').value='done'; }
    save(); sumUp();
  };
  $('sMin').oninput=e=>{ s.minutes=+e.target.value||0; save(); sumUp(); };
  sumUp();
}

function renderLoad(){
  const data=allDates().filter(d=>peek(d).status==='done'&&peek(d).rpe!==''&&peek(d).rpe!=null).map(d=>{
    const ss=D.sessions[d];
    return {d,rpe:+ss.rpe,srpe:Math.round(ss.rpe*(ss.minutes??90))};
  });
  const W=700,H=180,pad=30, mx=Math.max(900,...data.map(x=>x.srpe));
  const bw=data.length?(W-pad*2)/data.length:0;
  const bars=data.map((x,i)=>{
    const h=(x.srpe/mx)*(H-pad*2);
    return `<rect x="${pad+i*bw+3}" y="${H-pad-h}" width="${Math.max(bw-6,2)}" height="${h}" fill="#E2873B"><title>${x.d} sRPE ${x.srpe}</title></rect>
      <text x="${pad+i*bw+bw/2}" y="${H-pad+14}" font-size="10" text-anchor="middle" fill="#6b7280">${md(x.d)}</text>`;
  }).join('');
  $('tab-load').innerHTML=data.length?`
  <svg viewBox="0 0 ${W} ${H}" class="chart"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#ccc"/>${bars}</svg>
  <table><tr><th>日期</th><th>RPE</th><th>sRPE</th></tr>
  ${data.map(x=>`<tr><td>${x.d}</td><td>${x.rpe}</td><td>${x.srpe}</td></tr>`).join('')}</table>`
  :'<p class="muted">課堂標成「已完成」並填入 RPE 後，這裡會顯示每堂的 sRPE。</p>';
}

function openIDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open('zsjh_sc',1); r.onupgradeneeded=e=>e.target.result.createObjectStore('kv'); r.onsuccess=e=>res(e.target.result); r.onerror=rej; }); }
async function idbGet(k){ const db=await openIDB(); return new Promise(res=>{ const r=db.transaction('kv').objectStore('kv').get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }); }
async function idbSet(k,v){ const db=await openIDB(); return new Promise(res=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; }); }
async function pickDir(){
  if(!window.showDirectoryPicker){ alert('此瀏覽器不支援資料夾自動儲存，請用 Chrome，或定期按「匯出備份」。'); return; }
  try{ const h=await window.showDirectoryPicker({mode:'readwrite'}); await idbSet('dir',h); await saveToFolder(); fsStatus(); toast('已設定自動儲存'); }
  catch(e){ if(e.name!=='AbortError') alert(e.message); }
}
async function saveToFolder(){
  try{
    const h=await idbGet('dir'); if(!h) return false;
    if(await h.queryPermission({mode:'readwrite'})!=='granted') return false;
    const fh=await h.getFileHandle('中山國中_autosave.json',{create:true});
    const w=await fh.createWritable(); await w.write(JSON.stringify(D,null,1)); await w.close(); return true;
  }catch(e){ return false; }
}
async function fsStatus(){
  const el=$('fsState'); if(!el) return;
  try{
    const h=await idbGet('dir');
    if(!h){ el.textContent='尚未設定'; return; }
    const p=await h.queryPermission({mode:'readwrite'});
    el.innerHTML=p==='granted'?'✅ 已啟用（'+esc(h.name)+'）':'⚠️ 需要重新授權（'+esc(h.name)+'）<button class="b o" id="reauth" style="margin-left:6px">授權</button>';
    if($('reauth')) $('reauth').onclick=async()=>{ if(await h.requestPermission({mode:'readwrite'})==='granted'){ await saveToFolder(); fsStatus(); } };
  }catch(e){ el.textContent='無法使用'; }
}

if('serviceWorker' in navigator && location.protocol==='https:'){
  const hadCtl=!!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadCtl&&!reloaded){ reloaded=true; location.reload(); } });
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    reg.update();
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update(); });
  }).catch(()=>{});
